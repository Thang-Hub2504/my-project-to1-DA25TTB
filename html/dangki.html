<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<title>Trang đăng kí</title>
	<link rel="stylesheet" href="../css/dangki.css">
</head>
<body>
	<form id="login">
	<div id = "formDN">
		<h1>ĐĂNG KÍ</h1>
			<div id = "dn">
				<input type = "text"
						id = "txtUsername1"
						name = "txtUsername"
						placeholder = "Họ và Tên"><br>
						
				<input type = "text"
						id = "txtUsername2"
						name = "txtUsername"
						placeholder = "Tài khoản"><br>
						
				<input type = "password"
						id = "txtPassword1"
						name = "txtPassword"
						placeholder = "Mật khẩu"><br>
						
				<input type = "password"
						id = "txtPassword2"
						name = "txtPassword"
						placeholder = " Nhập lại mật khẩu"><br>
				<input type="email" 
						id="email" 
						name="email" 
						placeholder = "Nhập mail cá nhân"><br>
				<input type="date" 
						id="birthday" 
						name="birthday"><br>
				
				<input type="checkbox" 
						id="gender" 
						name="gender" 
						value="Male">
				<label for="vehicle1">Nam</label><br>
				
				<input type="checkbox" 
						id="gender" 
						name="gender" 
						value="Female">
				<label for="vehicle2">Nữ</label><br>
				
				<input type="image"
						src = "../assets/img/use.jpg"
						alt="Submit" 
						width="48" 
						height="48"><br>
						
				<label for="myfile">Select a file</label>
				<input type="file" 
						id="myfile" 
						name="myfile"><br>	
						
				<input type = "submit"
						id = "button"
						name = "sblogin"
						value = "Đăng kí">
						
				<input type = "reset"
						id = "reset"
						name = "rsCancle"
						value = "Hủy">
						

			</div>
	</div>		
	</form>
</body>
</html>
